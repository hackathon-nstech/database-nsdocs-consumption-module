version: '3.8'

services:
  db:
    image: mysql:8.0.32
    container_name: nsdocs_db
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=nsdocs_consumption
      - TZ=America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts/ddl.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./scripts/dml.sql:/docker-entrypoint-initdb.d/2_data.sql
      - ./scripts:/home/scripts
    ports:
      - "3306:3306"
    command:
      - '--skip-log-bin'
      - '--default-authentication-plugin=mysql_native_password'
      - '--sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
      - '--max-connections=500' # Increase connection limit
    networks:
      - nsdocs_network

  redis:
    image: redis:7.2-alpine
    container_name: nsdocs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # Enable persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nsdocs_network

  flusher:
    build:
      context: .
      dockerfile: src/NSdocs.Flusher/Dockerfile
    # container_name: nsdocs_flusher # Cannot set container_name when scaling
    deploy:
      replicas: 3 # Example: Start with 2 replicas
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=nsdocs_consumption;User=root;Password=;
      - Redis__ConnectionString=redis:6379
      - HOSTNAME # Pass HOSTNAME from the container environment to be used as InstanceId
    networks:
      - nsdocs_network

  api:
    build:
      context: .
      dockerfile: src/NSdocs.API/Dockerfile
    # container_name: nsdocs_api # Cannot set container_name when scaling
    deploy:
      replicas: 3 # Start with 2 replicas
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080 # Ensure the app listens on the exposed port
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=nsdocs_consumption;User=root;Password=;
      - Redis__ConnectionString=redis:6379
      # Add any other necessary environment variables for the API
    # ports:
      # We don't map a fixed host port because we have multiple replicas.
      # A load balancer (like Nginx, Traefik, or HAProxy) would typically sit in front
      # and distribute traffic to the replicas on port 8080.
      # For direct testing without a load balancer, you could temporarily map ports like:
      # - "5030:8080"
      # - "5031:8080"
      # But this requires managing ports manually and isn't ideal for scaling.
      # Port 8080 is exposed internally by the Dockerfile EXPOSE instruction
      # No need to list it here explicitly unless mapping to host.
    networks:
      - nsdocs_network

  nginx:
    image: nginx:alpine
    container_name: nsdocs_lb
    ports:
      - "5030:80" # Map host port 5030 to Nginx container port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # Mount custom Nginx config read-only
    depends_on:
      - api # Wait for API service to be started (doesn't guarantee readiness)
    networks:
      - nsdocs_network

volumes:
  db_data:
  redis_data:

networks:
  nsdocs_network:
    driver: bridge
