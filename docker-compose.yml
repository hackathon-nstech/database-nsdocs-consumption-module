version: '3.8'

services:
  db:
    image: mysql:8.0.32
    container_name: nsdocs_db
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=nsdocs_consumption
      - TZ=America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts/ddl.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./scripts/dml.sql:/docker-entrypoint-initdb.d/2_data.sql
      - ./scripts:/home/scripts
    ports:
      - "3306:3306"
    command:
      - '--skip-log-bin'
      - '--default-authentication-plugin=mysql_native_password'
      - '--sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
    networks:
      - nsdocs_network

  redis:
    image: redis:7.2-alpine
    container_name: nsdocs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # Enable persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nsdocs_network

  flusher:
    build:
      context: .
      dockerfile: src/NSdocs.Flusher/Dockerfile
    # container_name: nsdocs_flusher # Cannot set container_name when scaling
    deploy:
      replicas: 2 # Example: Start with 2 replicas
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=nsdocs_consumption;User=root;Password=;
      - Redis__ConnectionString=redis:6379
      - HOSTNAME # Pass HOSTNAME from the container environment to be used as InstanceId
    networks:
      - nsdocs_network

volumes:
  db_data:
  redis_data:

networks:
  nsdocs_network:
    driver: bridge
