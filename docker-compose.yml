version: '3.8'

services:
  db:
    image: mysql:8.0.32
    container_name: nsdocs_db
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=nsdocs_consumption
      - TZ=America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts/ddl.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./scripts/dml.sql:/docker-entrypoint-initdb.d/2_data.sql
      - ./scripts:/home/scripts
    ports:
      - "3306:3306"
    command:
      - '--skip-log-bin'
      - '--default-authentication-plugin=mysql_native_password'
      - '--sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
    networks:
      - nsdocs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s

  api:
    build: .
    container_name: nsdocs_api
    environment:
      - DATABASE_URL=mysql://root:@db:3306/nsdocs_consumption
      - PORT=3000
      - NODE_ENV=development
    ports:
      - "3001:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nsdocs-network
    restart: unless-stopped
    command: sh -c "npx prisma generate --schema=./prisma/schema.prisma && npm run start:dev"

networks:
  nsdocs-network:
    driver: bridge

volumes:
  db_data:
